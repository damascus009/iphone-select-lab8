<!doctype html><html lang="uk"><meta charset="utf-8"><title>Theme accessibility audit</title><h1>Theme accessibility audit</h1><pre id="results">Running…</pre><iframe title="Page under test" style="width:1200px;height:900px"></iframe><script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#results'),results=[];
const load=src=>new Promise(resolve=>{frame.onload=()=>resolve(frame.contentDocument);frame.src=src;});
for(const page of ['index','catalog','about','contacts','viewer'])for(const theme of ['light','dark']){
 const doc=await load('../'+page+'.html');doc.documentElement.dataset.theme=theme;await doc.fonts.ready;await new Promise(r=>setTimeout(r,450));
 const script=doc.createElement('script');script.src='../tmp/axe.min.js';await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;doc.head.append(script)});
 if(page==='viewer'){doc.querySelector('#viewer-load').click();await new Promise(r=>setTimeout(r,1000));}
 if(page==='contacts'){doc.querySelector('#feedbackForm').requestSubmit();}
 const report=await frame.contentWindow.axe.run(doc,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});
 results.push({page,theme,violations:report.violations.map(x=>({id:x.id,impact:x.impact,nodes:x.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),incomplete:report.incomplete.map(x=>({id:x.id,count:x.nodes.length}))});out.textContent=JSON.stringify(results,null,2);
}
out.dataset.done='true';
</script></html>
